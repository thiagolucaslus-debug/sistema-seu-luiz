<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Administração Financeira</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #13294b 0%, #070d19 75%);
      color: #f1f5f9;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .splash-logo {
      width: 190px;
      height: 190px;
      object-fit: contain;
      filter: drop-shadow(0 14px 32px rgba(245, 184, 46, 0.28));
      margin-bottom: 14px;
      animation: floatPulse 1.6s ease-in-out infinite;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
    }
    .loader-track {
      width: 210px;
      height: 4px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 18px;
    }
    .loader-bar {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #f5b82e, #38bdf8);
      border-radius: 999px;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes floatPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.03); }
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(240%); }
    }
  </style>
</head>
<body>
  <img src="icon.png" alt="Administração Financeira" class="splash-logo" draggable="false" />
  <p>Iniciando painel local integrado e sincronização com celular…</p>
  <div class="loader-track"><div class="loader-bar"></div></div>
</body>
</html>
